version: '3.8'

services:
  cyber-forensic-backend:
    image: lenyx/cyber-forensic
    container_name: cyber-forensic-backend
    ports:
      - "8000:8000"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      frontend-net:
        ipv4_address: 172.19.0.2
      backend-net:
        ipv4_address: 172.20.0.2
    volumes:
      - ./app/:/app/

  database-mongo:
    image: lenyx/mongodb
    container_name: database-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: 
      - "27017:27017"
    networks:
      backend-net:
        ipv4_address: 172.20.0.6
  
  database-mysql:
    image: lenyx/mysql
    container_name: database-mysql
    ports:
      - "3307:3306"
    networks:
      backend-net:
        ipv4_address: 172.20.0.5
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=cyber_forensic_db
  
  lab-victim-test:
    image: lenyx/machines-test
    container_name: lab-victim-test
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ROLE=victim         
    networks:
      backend-net:
        ipv4_address: 172.20.0.3

  lab-attacker-test:
    image: lenyx/machines-test
    container_name: lab-attacker-test
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1 
    environment:
      - ROLE=attacker       
    volumes:
      - ./tests/:/tests/   
    networks:
      frontend-net:
        ipv4_address: 172.19.0.4

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cyber-forensic-web
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - /web/node_modules
    networks:
      - frontend-net
    depends_on:
      - cyber-forensic-backend

networks:
  frontend-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
  backend-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1